<!DOCTYPE html>
<html>
<head>
    <title>Food Website</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin:0;
            background:#f5f5f5;
            text-align:center;
        }

        header{
            background:#ff6b35;
            color:white;
            padding:30px;
        }

        .menu{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
            margin:30px;
        }

        .card{
            background:white;
            width:250px;
            padding:20px;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        button{
            background:#ff6b35;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:8px;
            cursor:pointer;
        }

        footer{
            margin-top:30px;
            background:#222;
            color:white;
            padding:20px;
        }
    </style>
</head>
<body>

<header>
    <h1>🍔 Rakha Food</h1>
    <p>Makanan Enak Harga Bersahabat</p>
</header>

<h2>Menu Favorit</h2>

<div class="menu">

    <div class="card">
        <h3>🍕 Pizza</h3>
        <p>Rp35.000</p>
        <button>Pesan</button>
    </div>

    <div class="card">
        <h3>🍔 Burger</h3>
        <p>Rp25.000</p>
        <button>Pesan</button>
    </div>

    <div class="card">
        <h3>🍟 Kentang Goreng</h3>
        <p>Rp15.000</p>
        <button>Pesan</button>
    </div>

</div>

<footer>
    © 2026 Rakha Food
</footer>

</body>
</html>
